name: Hausie AI
slug: hausie_ai
version: "0.3.0"
description: Local-first contextual learning for Hausie smart homes
url: https://github.com/Hausie-au/hausie-ai-local
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
host_network: false
init: false
ingress: true
ingress_port: 8099
ingress_entry: /
panel_title: Hausie AI
panel_icon: mdi:brain
stage: experimental
watchdog: http://[HOST]:[PORT:8099]/health
map:
  - type: addon_config
    read_only: false
options:
  cloud_url: ""
  cloud_token: ""
  device_id: ""
  poll_interval_seconds: 30
  auto_act: false
  dry_run: true
  min_observations: 3
  min_confidence: 0.8
  learn_from_unknown: false
  event_stream_enabled: true
  decision_interval_seconds: 60
  action_cooldown_seconds: 900
  reversal_window_seconds: 120
  log_level: info
schema:
  cloud_url: str
  cloud_token: password
  device_id: str
  poll_interval_seconds: int(10,3600)
  auto_act: bool
  dry_run: bool
  min_observations: int(1,100)
  min_confidence: float(0,1)
  learn_from_unknown: bool
  event_stream_enabled: bool
  decision_interval_seconds: int(30,3600)
  action_cooldown_seconds: int(30,86400)
  reversal_window_seconds: int(10,3600)
  log_level: list(debug|info|warning)

