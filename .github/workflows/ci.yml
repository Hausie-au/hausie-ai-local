name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r hausie_ai/requirements.txt pytest httpx
      - run: pytest -q
      - run: docker build --build-arg BUILD_VERSION=0.3.1 --build-arg BUILD_ARCH=amd64 -t hausie-ai-local:ci hausie_ai

