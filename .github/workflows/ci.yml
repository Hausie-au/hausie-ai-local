name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r hausie_ai/requirements.txt pytest httpx
      - run: pytest -q
      - run: node --test hausie_ai/tests/test_ui.mjs
      - run: docker build --build-arg BUILD_VERSION=0.10.0 --build-arg BUILD_ARCH=amd64 -t hausie-ai-local:ci hausie_ai
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/arm64 --build-arg BUILD_VERSION=0.10.0 --build-arg BUILD_ARCH=aarch64 -t hausie-ai-local:arm64-ci hausie_ai

